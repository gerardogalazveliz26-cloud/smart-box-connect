name: DJ Chany Panel (compilar APK)

on:
  push:
    paths:
      - 'djchany-panel/**'
      - 'panel/**'
      - '.github/workflows/djchany-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: djchany-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: djchany-panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la firma
        env:
          KEYSTORE_B64: ${{ secrets.DJCHANY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/djchany.jks"
            echo "DJCHANY_KEYSTORE_PATH=$RUNNER_TEMP/djchany.jks" >> "$GITHUB_ENV"
            echo "Firma: clave definitiva de DJ Chany"
          else
            echo "::warning::Falta el secreto DJCHANY_KEYSTORE_B64: el APK se firma con una clave temporal."
          fi

      - name: Compilar
        env:
          DJCHANY_KEYSTORE_PASSWORD: ${{ secrets.DJCHANY_KEYSTORE_PASSWORD }}
          DJCHANY_KEY_ALIAS: ${{ secrets.DJCHANY_KEY_ALIAS }}
          DJCHANY_KEY_PASSWORD: ${{ secrets.DJCHANY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Preparar el APK
        id: apk
        run: |
          set -euo pipefail
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/djchany-panel-$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file=djchany-panel-$name.apk" >> "$GITHUB_OUTPUT"
          sha256sum "out/djchany-panel-$name.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: djchany-panel-apk
          path: djchany-panel/out/*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          set -euo pipefail
          tag="djchany-panel-v$NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "out/$FILE" --clobber
          else
            pre=""
            [ "$GITHUB_REF_NAME" = "main" ] || pre="--prerelease"
            gh release create "$tag" "out/$FILE" --target "$GITHUB_SHA" $pre --latest=false \
              --title "DJ Chany Panel $NAME" \
              --notes "App para activar equipos de DJ Chany IPTV con su código."
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh release edit "$tag" --prerelease=false
          fi
